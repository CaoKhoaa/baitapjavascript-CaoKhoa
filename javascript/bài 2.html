<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra năm nhuận</title>
</head>
<body>
    <h3>Kiểm tra năm nhuận</h3>
    Nhập năm: <input type="number" id="year">
    <button onclick="kiemTra()">Kiểm tra</button>
    <p id="ket_qua"></p>

    <script>
        function kiemTra() {
        let year = parseInt(document.getElementById("year").value);
        let isLeapYear = false;
        if ((year % 400 == 0) || (year % 4 == 0 && year % 100 != 0)) {
        isLeapYear = true;
        }
        if (isLeapYear) {
        document.getElementById("ket_qua").innerHTML = year + " là năm nhuận";
        } else {
        document.getElementById("ket_qua").innerHTML = year + " không phải là năm nhuận";
        }
        }
    </script>
</body>
</html>
