<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tính số ngày trong tháng</title>
</head>
<body>
    <h3>Tính số ngày trong tháng</h3>
    <input type="number" id="thang">
    <button onclick="tinhSoNgay()">Tính số ngày</button>
    <p id="ket_qua"></p>

    <script>
        function tinhSoNgay() {
        let thang = parseInt(document.getElementById("thang").value);
        let ketQua = "";
        switch (thang) {
        case 1:
        case 3:
        case 5:
        case 7:
        case 8:
        case 10:
        case 12:
        ketQua = "Tháng " + thang + " có 31 ngày";
        break;
        case 2:
        ketQua = "Tháng 2 có 28 hoặc 29 ngày";
        break;
        case 4:
        case 6:
        case 9:
        case 11:
        ketQua = "Tháng " + thang + " có 30 ngày";
        break;
        default:
        ketQua = "Tháng không hợp lệ";
        }
        document.getElementById("ket_qua").innerHTML = ketQua;
        }
    </script>
</body>
</html>
