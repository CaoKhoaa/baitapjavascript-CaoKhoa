<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đổi năm âm lịch</title>
</head>
<body>
    <h3>Đổi năm dương lịch sang năm âm lịch</h3>
    Nhập năm dương lịch: <input type="number" id="nam_duong_lich">
    <button onclick="doiNam()">Đổi năm</button>
    <p id="ket_qua"></p>

    <script>
        function doiNam() {
        let nam_duong_lich = parseInt(document.getElementById("nam_duong_lich").value);
        let can = "";
        let chi = "";

        switch (nam_duong_lich % 10) {
        case 0: can = "Canh"; break;
        case 1: can = "Tân"; break;
        case 2: can = "Nhâm"; break;
        case 3: can = "Quý"; break;
        case 4: can = "Giáp"; break;
        case 5: can = "Ất"; break;
        case 6: can = "Bính"; break;
        case 7: can = "Đinh"; break;
        case 8: can = "Mậu"; break;
        case 9: can = "Kỷ"; break;
        }

        switch (nam_duong_lich % 12) {
        case 0: chi = "Thân"; break;
        case 1: chi = "Dậu"; break;
        case 2: chi = "Tuất"; break;
        case 3: chi = "Hợi"; break;
        case 4: chi = "Tý"; break;
        case 5: chi = "Sửu"; break;
        case 6: chi = "Dần"; break;
        case 7: chi = "Mẹo"; break;
        case 8: chi = "Thìn"; break;
        case 9: chi = "Tỵ"; break;
        case 10: chi = "Ngọ"; break;
        case 11: chi = "Mùi"; break;
        }

        document.getElementById("ket_qua").innerHTML = "Năm âm lịch: " + can + " " + chi;
        }
    </script>
</body>
</html>
